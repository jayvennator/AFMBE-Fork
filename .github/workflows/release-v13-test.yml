name: Package AFMBE V13 test release
on:
  push:
    branches:
      - codex/v13-attack-dialog-test
    paths:
      - .github/workflows/release-v13-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Foundry package
        run: |
          zip -q -r "$RUNNER_TEMP/afmbe-left-behind-v1.2.1-test.30.zip" . -x '.git/*' '.github/*'
          cp system.json "$RUNNER_TEMP/system.json"
          unzip -p "$RUNNER_TEMP/afmbe-left-behind-v1.2.1-test.30.zip" system.json | python3 -m json.tool >/dev/null
          unzip -tq "$RUNNER_TEMP/afmbe-left-behind-v1.2.1-test.30.zip"
          for source in modules/*.js; do node --check "$source"; done
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.1-test.30 \
            "$RUNNER_TEMP/afmbe-left-behind-v1.2.1-test.30.zip" \
            "$RUNNER_TEMP/system.json" \
            --target "$GITHUB_SHA" \
            --title "AFMBE: Left Behind V13 attachments test 30" \
            --notes "Foundry V13 build 351 test. Adds installable weapon attachments with Help rolls, slot limits, and bounded attack, recoil and range effects." \
            --prerelease
