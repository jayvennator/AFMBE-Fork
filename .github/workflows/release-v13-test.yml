name: Package AFMBE V13 test release
on:
  push:
    branches:
      - codex/v13-attack-dialog-test
    paths:
      - .github/workflows/release-v13-test.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Foundry package
        run: |
          zip -q -r "$RUNNER_TEMP/afmbe-left-behind-v1.2.1-test.39.zip" . -x '.git/*' '.github/*'
          cp system.json "$RUNNER_TEMP/system.json"
          unzip -p "$RUNNER_TEMP/afmbe-left-behind-v1.2.1-test.39.zip" system.json | python3 -m json.tool >/dev/null
          unzip -tq "$RUNNER_TEMP/afmbe-left-behind-v1.2.1-test.39.zip"
          python3 - <<'PY'
          import json
          manifest = json.load(open('system.json'))
          version = manifest['version']
          expected = f"https://github.com/jayvennator/AFMBE-Fork/releases/download/v{version}/afmbe-left-behind-v{version}.zip"
          assert manifest['download'] == expected, f"Manifest download does not match {version}"
          PY
          for source in modules/*.js; do node --check "$source"; done
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.1-test.39 \
            "$RUNNER_TEMP/afmbe-left-behind-v1.2.1-test.39.zip" \
            "$RUNNER_TEMP/system.json" \
            --target "$GITHUB_SHA" \
            --title "AFMBE: Left Behind V13 inventory test 39" \
            --notes "Foundry V13 build 351 test. Adds a separate Items tab next to Equipment for item lists and editing. Weapon item sheets now display optic, muzzle, underbarrel, stock, and accessory slots; install via the existing Help task and remove directly from the slot. Installed attachments leave their storage grid and stay mounted on the weapon." \
            --prerelease
